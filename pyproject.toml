[project]
name = "paychat-security-lab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.*",
    "uvicorn[standard]",
    "sqlalchemy==2.0.*",
    "alembic",
    "langgraph==0.2.*",
    "groq==0.13.*",
    "openai==1.55.*",
    "anthropic",
    "redis",
    "pydantic>=2.0",
    "python-dotenv",
    "psycopg2-binary",
    "aiolimiter>=1.2.1",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "black",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "faker",
    "httpx",
    "pre-commit",
]
redteam = [
    "httpx>=0.27",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "jupyter>=1.0",
    "ipykernel>=6.0",
]
rag = [
    "chromadb==1.5.*",
    "sentence-transformers",
]
whitebox = [
    "torch>=2.5",
    "transformers>=4.46",
]
agent = [
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

# Pull torch from the CPU-only wheel index. The container needs torch for the Fase 9
# perplexity detector but does CPU inference only; the default PyPI wheel bundles CUDA
# (~2-5 GB), which is wasteful here and on the 7.4 GB host. `explicit` keeps this index
# scoped to torch alone.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["notebooks/"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires ANTHROPIC_API_KEY or GROQ_API_KEY, excluded from CI default"]
addopts = "-m 'not integration'"
