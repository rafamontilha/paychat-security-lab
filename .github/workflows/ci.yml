name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .
        env:
          PYTHONPATH: .

      - name: Format check (black)
        run: uv run black --check .

      - name: Type check (mypy)
        run: uv run mypy app/
        env:
          PYTHONPATH: .

  test:
    runs-on: ubuntu-latest
    needs: quality

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paychat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/paychat
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --extra dev --extra rag --extra agent

      - name: Cache HuggingFace model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-all-MiniLM-L6-v2

      - name: Run migrations
        run: uv run alembic upgrade head
        env:
          PYTHONPATH: .

      - name: Run smoke tests
        run: uv run pytest tests/test_marketplace_smoke.py -v
        env:
          PYTHONPATH: .

      - name: Run RAG tests
        run: uv run pytest tests/test_rag_ingest.py tests/test_rag_endpoint.py -v
        env:
          PYTHONPATH: .

      - name: Run Variant A tool tests
        run: uv run pytest tests/test_variant_a_tools.py tests/test_variant_a_agent.py -v -m "not integration"
        env:
          PYTHONPATH: .

      - name: Run Variant B tests
        run: uv run pytest tests/test_variant_b_system_prompt.py tests/test_variant_b_client.py tests/test_variant_b_adapter.py -v -m "not integration"
        env:
          PYTHONPATH: .

      - name: Run agent routing tests
        run: uv run pytest tests/test_agent_routing.py -v
        env:
          PYTHONPATH: .
